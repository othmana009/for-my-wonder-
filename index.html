<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17142e"><title>The Little World of Jana ✦</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff1fb;font-family:Georgia,serif;background:radial-gradient(ellipse at 50% 0%,#514071,transparent 48%),linear-gradient(160deg,#11152d,#211934 65%,#342044)}#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 28% 64%,#ffe5b5 98%,transparent),radial-gradient(2px 2px at 76% 24%,#fff 98%,transparent),radial-gradient(1px 1px at 91% 70%,#fff 98%,transparent);opacity:.55;animation:tw 4s infinite alternate}@keyframes tw{to{opacity:.2}}main{position:relative;width:min(900px,94vw);margin:auto;padding:35px 0 55px;text-align:center}.k{font:11px Arial;letter-spacing:.25em;color:#e8cde4;text-transform:uppercase}h1{font-size:clamp(38px,8vw,66px);font-weight:400;margin:12px 0}h1 em{color:#ffb9d6}.lead{font:15px/1.7 Arial;color:#d6c9eb;max-width:570px;margin:auto}.world{position:relative;max-width:800px;height:420px;margin:28px auto 14px;border:1px solid #ffffff22;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#5a477c77,transparent 55%),linear-gradient(#24284c99,#34264b88);box-shadow:0 22px 65px #09081755}.moon{position:absolute;right:10%;top:8%;font-size:54px}.cloud{position:absolute;opacity:.25;font-size:48px;animation:drift 12s infinite alternate}.c1{left:8%;top:17%}.c2{right:12%;bottom:14%}@keyframes drift{to{transform:translateX(25px)}}.path{position:absolute;left:15%;right:15%;top:51%;border-top:2px dashed #ffe5a477;transform:rotate(-8deg)}.island{position:absolute;width:145px;height:112px;border:1px solid #fff8;border-radius:50% 50% 42% 42%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:white;background:linear-gradient(145deg,#8067a8,#4b477e);box-shadow:0 14px 0 #29264e,0 20px 28px #09081766;transition:.25s;z-index:2}.island:hover{transform:translateY(-7px) scale(1.04)}.island b{font-size:31px}.island span{font:11px Arial;letter-spacing:.07em;text-transform:uppercase}.island small{font:10px Arial;color:#ffe9f5}.i1{left:9%;top:17%}.i2{right:9%;top:17%;background:linear-gradient(145deg,#b06f9d,#694d89)}.i3{left:17%;bottom:10%;background:linear-gradient(145deg,#b08a62,#6e5b82)}.i4{right:17%;bottom:10%;background:linear-gradient(145deg,#8e83bd,#4c568e)}.hint,footer{font:12px Arial;color:#d6c9eb}.progress{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px}.dot{border:1px solid #ffffff30;border-radius:30px;padding:8px 13px;font:11px Arial;color:#d8cce8;background:#ffffff0a}.dot.done{background:#ffffff1c;color:#ffe4ad;border-color:#ffe4ad77}.panel{display:none;text-align:left;margin:20px auto 0;max-width:650px;padding:24px;border:1px solid #ffffff26;border-radius:22px;background:linear-gradient(145deg,#fffafc,#f4e4f1);color:#533d5a;box-shadow:0 18px 50px #09081755}.panel.show{display:block;animation:rise .35s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.panel h2{margin:0 0 10px;font-size:29px;font-weight:400;color:#8b547a;text-align:center}.panel p{font:15px/1.8 Arial;text-align:center}.close,.options button{border:1px solid #cba8c1;border-radius:20px;background:white;color:#674c65;padding:10px 15px;cursor:pointer}.close{display:block;margin:18px auto}.options{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.options button.selected{background:#efd9e8}.feedback{min-height:24px;color:#8a5479;font-weight:bold;text-align:center!important}footer{margin-top:28px}@media(max-width:600px){.world{height:500px}.island{width:125px;height:100px}.i1{left:5%;top:12%}.i2{right:5%;top:12%}.i3{left:5%;bottom:9%}.i4{right:5%;bottom:9%}.path{top:50%;left:10%;right:10%;transform:none}}
</style></head><body><div id="stars"></div><main><div class="k">a tiny universe, made just for you</div><h1>The Little World of <em>Jana ✦</em></h1><p class="lead">Four little islands are waiting to be explored. Take your time, follow the stars, and see what you discover.</p><section class="world"><div class="moon">☾</div><div class="cloud c1">☁</div><div class="cloud c2">☁</div><div class="path"></div>
<button class="island i1" onclick="openIsland('smile')"><b>☀️</b><span>Smile Island</span><small id="s-smile">a little joy</small></button><button class="island i2" onclick="openIsland('mystery')"><b>🔮</b><span>Mystery Island</span><small id="s-mystery">a tiny puzzle</small></button><button class="island i3" onclick="openIsland('music')"><b>🎵</b><span>Music Island</span><small id="s-music">a song & a thought</small></button><button class="island i4" onclick="openIsland('final')"><b>🌟</b><span>Star Island</span><small id="s-final">the last surprise</small></button></section><div class="hint">✦ Tap any island to explore it ✦</div><div class="progress"><span class="dot" id="p-smile">☀️ Smile</span><span class="dot" id="p-mystery">🔮 Mystery</span><span class="dot" id="p-music">🎵 Music</span><span class="dot" id="p-final">🌟 Star</span></div>
<section class="panel" id="panel"><h2 id="title"></h2><div id="body"></div><button class="close" onclick="closePanel()">Back to the little world</button></section><footer>made of stardust, tiny surprises, and kind thoughts ✦</footer></main>
<script>
const done=new Set(),panel=document.getElementById('panel');function mark(id){done.add(id);document.getElementById('p-'+id).classList.add('done');document.getElementById('s-'+id).textContent='✦ discovered'}function show(t,b){document.getElementById('title').textContent=t;document.getElementById('body').innerHTML=b;panel.classList.add('show');panel.scrollIntoView({behavior:'smooth',block:'nearest'})}function closePanel(){panel.classList.remove('show')}
function openIsland(id){if(id==='smile'){mark(id);show('A little sunshine ☀️',`<p>Some people make ordinary days feel a little brighter just by being themselves.</p><p>Here is your tiny reminder: you deserve days that make you smile for no special reason, surprises that warm your heart, and people who are happy to see you happy. 🌷</p><p>This island was made to leave a little smile on your face.</p>`)}if(id==='mystery'){show('A tiny mystery 🔮',`<p>Let's see if you can solve this little riddle:</p><p><b>I have a face and two hands, but no arms or legs. What am I?</b></p><div class="options"><button onclick="answer(false)">A) A doll</button><button onclick="answer(true)">B) A clock</button><button onclick="answer(false)">C) A painting</button></div><p class="feedback" id="feedback"></p>`)}if(id==='music'){mark(id);show('A song for this island 🎵',`<p>Every song has its own little world. This one is waiting here for you. ♡</p><div style="position:relative;width:100%;padding-top:56.25%;border-radius:15px;overflow:hidden;margin:16px 0;box-shadow:0 8px 24px #563d5b33"><iframe src="https://www.youtube-nocookie.com/embed/1lrFsXkT_rM?rel=0" title="Gigi Perez - Sailor Song (Official Music Video)" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><p><b>Press play when you're ready.</b> Hope this song makes your little island feel even more special. ♡</p><div class="options"><button onclick="chime()">Play a tiny original chime ♪</button></div><p class="feedback" id="feedback"></p>`)}if(id==='final'){if(done.size<3){show('One more thing… ✨',`<p>This little star is waiting for the other three islands to be explored first.</p><p>There are still ${3-done.size} island(s) left to discover. Go explore them, then come back here. ♡</p>`);return}mark(id);show('You found the star! 🌟',`<p style="font-size:20px;color:#9d648b"><b>Dear Jana,</b></p><p>I hope this little world gave you a few moments of fun. I made it as a small reminder that the world is full of tiny beautiful things, and I hope you keep finding them wherever you go.</p><p>May your days be kind, your dreams stay big, and your smile always find its way back. ♡</p><p style="font-size:25px">☾ ✦ 🌷 ✦ ☀️</p><p><b>You completed your little world!</b></p>`)}}
function answer(ok){let f=document.getElementById('feedback');if(ok){mark('mystery');f.textContent='That’s right! A clock! You found the clue. ✨'}else f.textContent='Not quite! Try once more. ♡'}
function chime(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C();[523.25,659.25,783.99].forEach((hz,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,c.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+i*.18+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.18+.55);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.18);o.stop(c.currentTime+i*.18+.6)});document.getElementById('feedback').textContent='A tiny sound, made just for this little world. ♡'}catch(e){document.getElementById('feedback').textContent='The little thought is still here. ♡'}}
</script></body></html>
